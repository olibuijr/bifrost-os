[package]
name = "bifrost-wm"
version = "0.1.0"
edition = "2021"
description = "BifrOSt window server: the Wayland compositor that owns window geometry and live glass"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bifrost-wm"
path = "src/main.rs"

[features]
default = ["nested", "drm"]
# real hardware and the VM: libseat, udev, libinput, GBM and KMS
drm = ["smithay/backend_drm", "smithay/backend_gbm", "smithay/backend_libinput", "smithay/backend_udev", "smithay/backend_session_libseat"]
# a window on another Wayland or X11 desktop, for development
nested = ["smithay/backend_winit"]

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_gl", "backend_egl"] }
png = "0.18"

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
