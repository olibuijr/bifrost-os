[package]
name = "bifrost-wm"
version = "0.1.0"
edition = "2021"
description = "BifrOSt window server: the Wayland compositor that owns window geometry and live glass"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bifrost-wm"
path = "src/main.rs"

[features]
default = ["nested", "drm", "xwayland"]
# real hardware and the VM: libseat, udev, libinput, GBM and KMS
drm = ["smithay/backend_drm", "smithay/backend_gbm", "smithay/backend_libinput", "smithay/backend_udev", "smithay/backend_session_libseat"]
# a window on another Wayland or X11 desktop, for development
nested = ["smithay/backend_winit"]
# X11 apps through XWayland (wm/src/xwayland.rs)
xwayland = ["smithay/xwayland"]
# tests that render on a real Vulkan device
gpu-tests = ["bifrost-gpu/gpu-tests"]

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_gl", "backend_egl"] }
png = "0.18"
# the final render server (docs/graphics-architecture.md): Vulkan via bifrost-gpu, layer trees via bifrost-layers
bifrost-gpu = { path = "../gpu" }
bifrost-layers = { path = "../layers", features = ["server"] }
# the boot frame the first scanout shows (docs/boot-architecture.md, "One frame")
bootweave-frame = { path = "../bootweave/frame" }
# ext-background-effect-v1 lives in the staging set
wayland-protocols = { version = "0.32", features = ["server", "staging"] }

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tempfile = "3"
