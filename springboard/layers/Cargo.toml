[package]
name = "bifrost-layers"
version = "0.1.0"
edition = "2021"
description = "Layer tree, transactions and animations shared by the SDK and the window server (docs/graphics-architecture.md)"

[dependencies]
# Wayland bindings for bifrost_layer_v1 (protocol/bifrost-layer-v1.xml), generated with wayland-scanner.
# The model (layer, tree, animation, codec) stays std only; `client` is for the SDK, `server` for bifrost-wm.
wayland-scanner = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-server = { version = "0.31", optional = true }

[features]
client = ["dep:wayland-scanner", "dep:wayland-backend", "dep:wayland-client"]
server = ["dep:wayland-scanner", "dep:wayland-backend", "dep:wayland-server"]
