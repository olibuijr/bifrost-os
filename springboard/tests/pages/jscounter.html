<!doctype html><html><head><title>Counter</title></head><body><h1 id='n'>0</h1><button id='b'>+</button><ul id='l'></ul><script>let c=0;document.getElementById('b').addEventListener('click',()=>{c++;document.getElementById('n').textContent=c;const li=document.createElement('li');li.textContent='row '+c;document.getElementById('l').appendChild(li)});</script></body></html>
