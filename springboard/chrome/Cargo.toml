[package]
name = "bifrost-chrome"
version = "0.1.0"
edition = "2021"
description = "The menu bar, Dock and panels as separate clients of the window server (docs/graphics-architecture.md)"

[dependencies]
bifrost-gpu = { path = "../gpu" }
bifrost-2d = { path = "../gfx2d" }
bifrost-render = { path = "../render" }
bifrost-layers = { path = "../layers", features = ["client"] }
bifrost-wire = { path = "../wire" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[[bin]]
name = "bifrost-menubar"
path = "src/bin/menubar.rs"

[[bin]]
name = "bifrost-dock"
path = "src/bin/dock.rs"

[[bin]]
name = "bifrost-panels"
path = "src/bin/panels.rs"
