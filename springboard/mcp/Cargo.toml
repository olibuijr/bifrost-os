[package]
name = "bifrost-mcp"
version = "0.5.0"
edition = "2021"
description = "MCP server for BifrOSt PC: screen, input, windows, app control sockets and the system, over stdio"

[dependencies]
serde_json = "1"
png = "0.18"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
libc = "0.2"
