[package]
name = "bifrost-jack"
version = "0.1.0"
edition = "2021"
description = "libjack ABI replacement on the BifrOSt audio server (docs/audio-architecture.md)"

[lib]
name = "jack"
crate-type = ["cdylib", "rlib"]

[dependencies]
bifrost-audio-types = { path = "../../types" }
bifrost-audio-hal = { path = "../../hal" }
libc = "0.2"
