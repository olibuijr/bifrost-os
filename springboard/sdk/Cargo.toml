[package]
name = "bifrost-app"
version = "0.1.0"
edition = "2021"
description = "SDK for BifrOSt apps: protocol client, event loop and the SpringBoard UI kit"

[dependencies]
bifrost-core = { path = "../core" }
bifrost-render = { path = "../render" }
bifrost-ui = { path = "../ui" }
bifrost-proto = { path = "../proto" }
bifrost-midi = { path = "../audio/midi" }
bifrost-audio-engine = { path = "../audio/engine" }
springboard = { path = ".." }
# the direct path of the final architecture (docs/graphics-architecture.md, "SDK"): GPU drawing and layer trees
bifrost-gpu = { path = "../gpu" }
bifrost-2d = { path = "../gfx2d" }
bifrost-layers = { path = "../layers", features = ["client"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[[bin]]
name = "bifrost-testapp"
path = "src/bin/testapp.rs"

[[bin]]
name = "bifrost-log"
path = "src/bin/bifrost-log.rs"

[dev-dependencies]
tempfile = "3"
