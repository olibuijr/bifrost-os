id = "is.olibuijr.stickies.desktop"
name = "Sticky Notes"
version = "0.1.0"
exec = "bifrost-stickies"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Small floating notes in six colours that restore on launch."
category = "Productivity"
architecture = "x86_64-linux"
permissions = ["storage", "documents"]
window = "full-size"

[[intent]]
id = "new-sticky"
title = "New Sticky Note"
description = "Adds an empty sticky note to the board."
shortcut = true
params = []

[[intent]]
id = "create-sticky"
title = "Create Sticky Note"
description = "Adds a sticky note with the given text."
shortcut = false
params = ["text:string?"]

[[log.subsystem]]
id = "is.olibuijr.stickies"
categories = ["save", "import"]
level = "notice"
