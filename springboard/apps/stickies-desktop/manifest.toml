id = "is.olibuijr.stickies.desktop"
name = "Sticky Notes"
version = "0.7.0"
exec = "bifrost-stickies"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Small floating notes in six colours that restore on launch."
category = "Productivity"
kind = "system-app"
architecture = "x86_64-linux"
permissions = ["storage", "documents"]
window = "full-size"

[[intent]]
id = "create-sticky"
title = "Make New Sticky Note"
description = "Creates a sticky note holding the given text."
shortcut = false
params = ["text:string"]

[[log.subsystem]]
id = "is.olibuijr.stickies"
categories = ["save", "import"]
level = "notice"
