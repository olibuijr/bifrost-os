[package]
name = "bifrost-assistant"
version = "1.4.1"
edition = "2021"

[lib]
name = "assistant"
path = "src/lib.rs"

[dependencies]
bifrost-app = { path = "../../sdk" }
bifrost-core = { path = "../../core" }
springboard = { path = "../.." }
assistant-client = { package = "bifrost-assistant-client", path = "../../assistant-client" }

[dev-dependencies]
springboard = { path = "../..", features = ["testkit"] }
