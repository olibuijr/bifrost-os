id = "is.olibuijr.mail.desktop"
name = "Mail"
version = "0.17.16"
exec = "bifrost-mail"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Mailboxes, messages and compose over IMAP and SMTP accounts."
category = "Productivity"
kind = "system-app"
architecture = "x86_64-linux"
permissions = ["storage", "network", "keychain", "notifications", "documents", "calendars"]
keychain_groups = ["is.bifrost.passwords"]
window = "full-size"
# the message list takes Shift-Up and Shift-Down Arrow to extend its selection: the shell sends the arrows with their
# modifiers as chords
edit_keys = true
schemes = ["mailto"]

[background]
tasks = ["is.olibuijr.mail.desktop.refresh"]
