[package]
name = "bifrost-mail"
version = "0.17.13"
edition = "2021"

[lib]
name = "bifrost_mail"
path = "src/lib.rs"

[[bin]]
name = "bifrost-mail"
path = "src/main.rs"

[dependencies]
bifrost-app = { path = "../../sdk" }
bifrost-core = { path = "../../core" }
# the shell's TLS transport (rustls + graviola, webpki roots): IMAP and SMTP connections reuse it
springboard = { path = "../.." }

[dev-dependencies]
springboard = { path = "../..", features = ["testkit"] }
