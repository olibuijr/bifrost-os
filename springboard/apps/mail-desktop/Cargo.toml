[package]
name = "bifrost-mail"
version = "0.3.1"
edition = "2021"

[lib]
name = "bifrost_mail"
path = "src/lib.rs"

[[bin]]
name = "bifrost-mail"
path = "src/main.rs"

[dependencies]
bifrost-app = { path = "../../sdk" }
