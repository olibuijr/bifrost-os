id = "is.olibuijr.calculator.desktop"
name = "Calculator"
version = "1.14.3"
exec = "bifrost-calculator"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Basic, scientific and programmer calculator with RPN, unit conversion and history."
category = "Utilities"
kind = "system-app"
architecture = "x86_64-linux"
permissions = ["storage"]
window = "full-size"
# the compact Basic window (27-Golden-Gate-Calculator.png); the app resizes it for the other keypads
window_size = "230x512"
min_size = "230x512"

[[intent]]
id = "evaluate"
title = "Evaluate"
description = "Evaluates an expression and returns the result."
shortcut = false
params = ["expression:string"]
