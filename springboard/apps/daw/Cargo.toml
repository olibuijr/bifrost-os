[package]
name = "bifrost-daw"
version = "0.2.6"
edition = "2021"
description = "DAW for BifrOSt PC: a Rust port of the mobile DAW (clip launcher, arrangement, piano roll, instruments and effects)."

[lib]
name = "daw"
path = "src/lib.rs"

[[bin]]
name = "bifrost-daw"
path = "src/main.rs"

[[bin]]
name = "daw-import"
path = "src/bin/daw-import.rs"

[[bin]]
name = "daw-render"
path = "src/bin/daw-render.rs"

[[bin]]
name = "daw-ai"
path = "src/bin/daw-ai.rs"

[dependencies]
bifrost-app = { path = "../../sdk" }
bifrost-core = { path = "../../core" }
springboard = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
springboard = { path = "../..", features = ["testkit"] }
