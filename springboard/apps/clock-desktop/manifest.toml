id = "is.olibuijr.clock.desktop"
name = "Clock"
version = "1.5.2"
exec = "bifrost-clock"
icon = "icon.png"
min_shell = "0.4.84"
summary = "World clocks, alarms that ring with the app closed, timers and a stopwatch."
category = "Utilities"
architecture = "x86_64-linux"
permissions = ["storage"]
window = "full-size"

[[intent]]
id = "world-clock-time"
title = "World Clock Time"
description = "Reports the time in a World Clock city, or on this device when no city is named."
shortcut = true
params = ["city:string?"]

[[intent]]
id = "start-stopwatch"
title = "Start Stopwatch"
description = "Starts the stopwatch if it is stopped."
shortcut = true

[[intent]]
id = "stop-stopwatch"
title = "Stop Stopwatch"
description = "Stops the stopwatch if it is running."
shortcut = true

[[intent]]
id = "record-lap"
title = "Record Lap"
description = "Records a lap while the stopwatch is running."
shortcut = true
