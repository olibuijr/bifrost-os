id = "is.olibuijr.console.desktop"
name = "Console"
version = "1.7.0"
exec = "bifrost-console"
icon = "icon.png"
min_shell = "0.5.4"
summary = "Reads the system log live and the crash reports, with search by process, subsystem, category and type."
category = "Utilities"
architecture = "x86_64-linux"
kind = "system-app"
entitlements = ["log-store"]
permissions = ["documents"]
handles = ["public.plain-text:alternate", "org.gnu.gnu-zip-archive:alternate"]
window = "full-size"

[[log.subsystem]]
id = "is.olibuijr.console.desktop"
categories = ["signpost"]
level = "notice"
