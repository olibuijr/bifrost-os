id = "is.olibuijr.preview.desktop"
name = "Viewer"
version = "0.11.17"
exec = "bifrost-viewer"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Views images and PDFs with zoom, rotation, page thumbnails, outline, markup list and search, page moves and deletes, markup, text boxes, shapes and signatures saved into the PDF, picture crop, flip, redaction and transparency, Save and Revert to Saved, copying PDF text, Adjust Color sliders, a contact sheet, slideshow and Inspector, and PNG, JPEG and PDF export."
category = "Utilities"
kind = "system-app"
architecture = "x86_64-linux"
permissions = ["storage", "documents"]
handles = ["public.png:owner", "public.jpeg:owner", "com.compuserve.gif:owner", "public.webp:owner", "public.svg-image:alternate", "public.image:default", "com.adobe.pdf:owner"]
window = "full-size"

[[service]]
title = "Open Images in Viewer"
send_types = ["public.image", "public.pdf"]
return_types = []
method = "open_images"
