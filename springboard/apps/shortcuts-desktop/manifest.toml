id = "is.olibuijr.shortcuts.desktop"
name = "Shortcuts"
version = "1.5.0"
exec = "bifrost-shortcuts"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Manage shortcut tiles; action execution is not yet supported on PC."
category = "Productivity"
architecture = "x86_64-linux"
permissions = ["storage", "notifications"]
window = "full-size"

[[intent]]
id = "run-shortcut"
title = "Run Shortcut"
description = "Runs a shortcut's actions. Pass its id, or its name when only one shortcut has it."
shortcut = false
params = ["shortcut:entity(Shortcut)?"]

[[intent]]
id = "plan-shortcut"
title = "Plan Shortcut"
description = "Lists the steps a shortcut would run, in order, without running them."
shortcut = false
params = ["shortcut:entity(Shortcut)?"]
