id = "is.olibuijr.dictionary.desktop"
name = "Dictionary"
version = "0.6.10"
exec = "bifrost-dictionary"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Looks words up in installed StarDict dictionaries, with suggestions as you type."
category = "Reference"
kind = "system-app"
architecture = "x86_64-linux"
permissions = ["storage"]
window = "full-size"
schemes = ["dict", "x-dictionary"]

[[service]]
title = "Look Up in Dictionary"
send_types = ["public.utf8-plain-text"]
return_types = []
method = "look_up"

[[intent]]
id = "look-up"
title = "Look Up"
description = "Looks a word up in the installed dictionaries and returns its definition."
shortcut = false
params = ["word:string"]

[[log.subsystem]]
id = "is.olibuijr.dictionary"
categories = ["lookup"]
level = "notice"
