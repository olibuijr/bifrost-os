id = "is.olibuijr.calendar.desktop"
name = "Calendar"
version = "1.14.0"
exec = "bifrost-calendar"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Month, week and day calendar with events, repeats and alerts."
category = "Productivity"
architecture = "x86_64-linux"
permissions = ["storage", "notifications", "keychain", "documents"]
keychain_groups = ["is.bifrost.passwords"]
window = "full-size"
handles = ["public.calendar-event:default"]

[[intent]]
id = "create-event"
title = "Create Event"
description = "Adds an event to the calendar."
shortcut = false
params = ["title:string", "date:date", "time:string?"]

[[intent]]
id = "show-date"
title = "Show Date"
description = "Shows a day in the calendar."
shortcut = false
params = ["date:date"]
