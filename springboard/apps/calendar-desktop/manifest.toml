id = "is.olibuijr.calendar.desktop"
name = "Calendar"
version = "1.19.7"
exec = "bifrost-calendar"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Month, week and day calendar with events, repeats, alerts, search, holidays and subscribed calendars."
category = "Productivity"
kind = "system-app"
architecture = "x86_64-linux"
permissions = ["storage", "documents", "notifications"]
window = "full-size"
handles = ["public.calendar-event:default"]
schemes = ["webcal", "webcals"]

[[intent]]
id = "show-date"
title = "Show Date"
description = "Opens the calendar on a date."
shortcut = false
params = ["date:date"]

[[intent]]
id = "show-event"
title = "Show Event"
description = "Opens an event on its day."
shortcut = false
params = ["event:entity(Event)"]

[[intent]]
id = "create-event"
title = "Create Event"
description = "Adds an event to the calendar."
shortcut = false
params = ["title:string", "start:date?", "minutes:int?", "location:string?", "notes:string?", "all_day:bool?"]

[[script.command]]
name = "make new event"
event = "calendar.make"
params = ["title", "start", "minutes", "location", "notes", "all_day"]
result = "event"

[[script.class]]
name = "event"
properties = []
elements = []
