id = "is.olibuijr.maps.desktop"
name = "Maps"
version = "0.6.0"
exec = "bifrost-maps"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Maps with search, directions by car, foot, bike and transit, turn-by-turn guidance, saved places, offline areas, traffic and GPX files."
category = "Travel"
kind = "system-app"
architecture = "x86_64-linux"
permissions = ["storage", "network", "documents"]
window = "full-size"
schemes = ["maps", "map", "geo"]
handles = ["com.topografix.gpx:default"]

[privacy]
location = "Maps shows where you are on the map and the directions from there."
