[package]
name = "bifrost-keyboard"
version = "1.1.5"
edition = "2021"
description = "BifrOSt on-screen keyboard (system app, provides = [\"keyboard\"])"

[[bin]]
name = "bifrost-keyboard"
path = "src/main.rs"

[dependencies]
bifrost-app = { path = "../../sdk" }
springboard = { path = "../.." }
bifrost-core = { path = "../../core" }

[dev-dependencies]
springboard = { path = "../..", features = ["testkit"] }
