id = "is.olibuijr.notes.desktop"
name = "Notes"
version = "1.12.0"
exec = "bifrost-notes"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Notes with folders, Markdown, checklists, attachments and search."
category = "Productivity"
architecture = "x86_64-linux"
permissions = ["storage", "documents"]
window = "full-size"

[[intent]]
id = "new-note"
title = "New Note"
description = "Starts a new note in Notes."
shortcut = true
params = []

[[intent]]
id = "create-note"
title = "Create Note"
description = "Creates a note with the given text and opens it."
shortcut = false
params = ["text:string?"]

[[intent]]
id = "search-notes"
title = "Search Notes"
description = "Lists the notes that contain the query."
shortcut = false
params = ["query:string"]

[[log.subsystem]]
id = "is.olibuijr.notes"
categories = ["save", "sync"]
level = "notice"
