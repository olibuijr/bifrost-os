id = "is.olibuijr.notes.desktop"
name = "Notes"
version = "1.22.0"
exec = "bifrost-notes"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Notes with folders, Markdown, checklists, attachments and search."
schemes = ["notes"]
category = "Productivity"
kind = "system-app"
architecture = "x86_64-linux"
permissions = ["storage", "documents"]
window = "full-size"

[[intent]]
id = "new-note"
title = "New Note"
description = "Starts a new note in Notes."
shortcut = true
params = []

[[intent]]
id = "create-note"
title = "Create Note"
description = "Creates a note with the given text and opens it."
shortcut = false
params = ["text:string?"]

[[intent]]
id = "search-notes"
title = "Search Notes"
description = "Lists the notes that contain the query."
shortcut = false
params = ["query:string"]

[[intent]]
id = "open-note"
title = "Open Note"
description = "Opens the note with the given title."
shortcut = false
params = ["note:string"]

[[intent]]
id = "open-folder"
title = "Open Folder"
description = "Shows the notes of a folder."
shortcut = false
params = ["folder:string"]

[[preview]]
id = "is.olibuijr.notes.markdown"
types = ["net.daringfireball.markdown"]
generator = "preview.render"
timeout_ms = 3000

[[script.command]]
name = "make new note"
event = "notes.make"
params = ["title", "body"]
result = "note"

[[script.class]]
name = "note"
properties = ["name", "id", "folder", "modified"]
elements = []

[[log.subsystem]]
id = "is.olibuijr.notes"
categories = ["save", "sync"]
level = "notice"
