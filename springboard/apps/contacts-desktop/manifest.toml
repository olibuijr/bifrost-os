id = "is.olibuijr.contacts.desktop"
name = "Contacts"
version = "1.17.0"
exec = "bifrost-contacts"
icon = "icon.png"
min_shell = "0.4.84"
summary = "Address book with search and contact cards."
category = "Productivity"
kind = "system-app"
architecture = "x86_64-linux"
permissions = ["storage"]
window = "full-size"

[[intent]]
id = "view-card"
title = "View Card"
description = "Opens the card of a contact, given its name or identifier."
shortcut = false
params = ["contact:string"]

[[intent]]
id = "create-contact"
title = "Create Contact"
description = "Adds a contact and opens its card."
shortcut = false
params = ["name:string", "phone:string?", "email:string?", "company:string?"]

[[intent]]
id = "search-contacts"
title = "Search Contacts"
description = "Shows the contacts that match the text and lists them."
shortcut = false
params = ["query:string"]
