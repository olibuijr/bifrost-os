[package]
name = "bifrost-cmd"
version = "0.1.0"
edition = "2021"
description = "Command-line tools for BifrOSt (one binary per tool in src/bin/, shared helpers in src/lib.rs)."

[dependencies]
bifrost-core = { path = "../core" }
bifrost-ui = { path = "../ui" }
# the shell's PNG writer, settings store and data directory (screencapture, pmset)
springboard = { path = ".." }
bifrost-proto = { path = "../proto" }
# the AppEvent client `osascript` sends `tell app` commands with (bifrost_app::app_events)
bifrost-app = { path = "../sdk" }
# `automator` compiles the Automator app's workflow model and runner (apps/automator-desktop/src), which use these
png = "0.18"
tempfile = "3"
