[package]
name = "bootweave-efi"
version = "0.1.0"
edition = "2021"

[dependencies]
bootweave-frame = { path = "../frame" }
uefi = { version = "0.41", features = ["alloc", "panic_handler", "global_allocator"] }
# the boot frame the loader paints (docs/boot-architecture.md, "One frame")
bootweave-frame = { path = "../frame" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Keep the EFI build callable from the repository's fast ISO iteration path.
[profile.fast]
inherits = "release"
lto = false
