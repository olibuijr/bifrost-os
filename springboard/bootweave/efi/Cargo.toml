[package]
name = "bootweave-efi"
version = "0.1.0"
edition = "2021"

[dependencies]
uefi = { version = "0.41", features = ["alloc", "panic_handler", "global_allocator"] }
# the one boot frame (docs/boot-architecture.md); the loader draws its screens with it
bootweave-frame = { path = "../frame" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Keep the EFI build callable from the repository's fast ISO iteration path.
[profile.fast]
inherits = "release"
lto = false
