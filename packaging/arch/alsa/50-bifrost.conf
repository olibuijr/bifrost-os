# BifrOSt audio server as the ALSA default (docs/audio-architecture.md, "ALSA plug-in").
# alsa-lib's plug converts rate, channels and format; the bifrost plug-in
# (/usr/lib/alsa-lib/libasound_module_pcm_bifrost.so) talks to bifrost-audiod.
pcm.bifrost {
	type bifrost
	hint {
		show on
		description "BifrOSt audio server"
	}
}

pcm.!default {
	type plug
	slave.pcm "bifrost"
}

# Mixer controls stay with the kernel card; volume belongs to the server's objects.
ctl.!default {
	type hw
	card 0
}
