# Intel e1000e NICs (I219 and kin) hang under heavy transmit with "NETDEV WATCHDOG: transmit queue 0 timed out"
# and reset the link. Turning off TSO and GSO offload avoids it. NetworkManager applies these as connection defaults
# to every connection on an e1000e device, so no ethtool package is needed (0 = off).
[connection-bifrost-e1000e]
match-device=driver:e1000e
ethtool.feature-tso=0
ethtool.feature-gso=0
