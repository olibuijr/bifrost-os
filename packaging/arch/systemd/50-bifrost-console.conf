# BifrOSt: PID 1 writes no status lines and no log lines to the console (docs/boot-architecture.md, "Text-free on
# every path"). Messages go to the journal. The kernel command line overrides these for a Ctrl+V verbose boot
# (systemd.show_status=true systemd.log_level=info), which is the one way to see them on screen.
[Manager]
ShowStatus=no
LogTarget=journal
