# BifrOSt: seatd starts as soon as udev is up. The desktop needs it first, and its default ordering (basic.target,
# plus PrivateTmp's local-fs.target) kept the desktop waiting on systemd's mount-event rate limit (~0.9 s).
[Unit]
DefaultDependencies=no
After=systemd-udevd.service systemd-udev-trigger.service systemd-tmpfiles-setup-dev.service
Conflicts=shutdown.target
Before=shutdown.target

[Service]
PrivateTmp=no
