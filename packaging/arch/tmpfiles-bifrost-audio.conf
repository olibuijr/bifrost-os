# /run/bifrost/audio holds the control socket (bifrost-audiod creates it with mode 0666: any local user is a client).
# The shell creates /run/bifrost/shell-control.sock in this directory at start (mode 0600, owned by the installed account,
# peer uid checked with SO_PEERCRED); the directory itself must be root-owned and not writable by others.
d /run/bifrost 0755 root root -
d /run/bifrost/audio 0755 audio audio -
# The PM QoS device is root-only by default; the audio user holds a latency request on it while a device runs.
z /dev/cpu_dma_latency 0660 root audio -
