<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Compatibility family names mapped to open equivalents. Liberation and Croscore are metric-compatible
     (same advance widths) for Sans, Serif and Mono; the rest are visual stand-ins. -->
<fontconfig>
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family><family>Arimo</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Liberation Sans</family><family>Arimo</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>Liberation Sans</family><family>Arimo</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Liberation Serif</family><family>Tinos</family></accept></alias>
  <alias binding="same"><family>Times</family><accept><family>Liberation Serif</family><family>Tinos</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Liberation Mono</family><family>Cousine</family></accept></alias>
  <alias binding="same"><family>Courier</family><accept><family>Liberation Mono</family><family>Cousine</family></accept></alias>
  <alias binding="same"><family>Menlo</family><accept><family>DejaVu Sans Mono</family><family>Cousine</family></accept></alias>
  <alias binding="same"><family>Monaco</family><accept><family>DejaVu Sans Mono</family><family>Cousine</family></accept></alias>
  <alias binding="same"><family>Symbol</family><accept><family>Standard Symbols PS</family><family>Noto Sans Symbols</family></accept></alias>
  <alias binding="same"><family>Zapf Dingbats</family><accept><family>D050000L</family><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>STIXGeneral</family><accept><family>STIX Two Text</family></accept></alias>
  <alias binding="same"><family>STIXTwoMath</family><accept><family>STIX Two Math</family></accept></alias>
  <alias binding="same"><family>LastResort</family><accept><family>Unifont</family></accept></alias>
</fontconfig>
