<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- CJK punctuation in the Browser. The engine's font fallback list is fixed (Servo 0.7.0, fonts/platform): for Han text it
     tries Noto Sans CJK HK, SC and TC, but the marks of CJK Symbols and Punctuation (U+3000 to U+303F: the ideographic full
     stop and comma, corner brackets), CJK Strokes, Enclosed CJK Letters and Months, CJK Compatibility and CJK Compatibility
     Forms are script Common, so for them it only tries the generic families, Noto Sans, the Noto Symbols, the DejaVu and
     Free families and, last of all, "Droid Sans Fallback". None of those that BifrOSt packages covers the marks, and the page
     shows a missing-glyph box (example.com in Chinese). Noto Sans CJK SC (package noto-fonts-cjk) gets that last family name
     as a second name, so the installed CJK font answers the last fallback and nothing earlier in the list is displaced.
     SC because it draws the full stop and comma where simplified Chinese puts them (lower left).

     A scan rule is applied only while a font directory is scanned, and fontconfig keeps the result in its cache: after this
     file changes, `fc-cache -sf` rebuilds the system cache (springboard.install does it). The Browser reads the family list
     once, at engine start. Check: `fc-list "Droid Sans Fallback" family style` lists the Noto Sans CJK SC faces. -->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="append"><string>Droid Sans Fallback</string></edit>
  </match>
</fontconfig>
