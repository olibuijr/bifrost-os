# Live installer initramfs: no microcode hook (17.7 MB the firmware would read from USB at every boot;
# installed systems load it from their own autodetected image).
# No memdisk hook: it boots the ISO through syslinux memdisk (BIOS), and the ISO is UEFI-only.
MODULES=(virtio_gpu virtio_pci)
HOOKS=(base udev modconf archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard bifrost-live-trim)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-1 -T0)
